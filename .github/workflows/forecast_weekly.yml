name: numeric forecast weekly evaluation

on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      input_path:
        description: "Optional checked-out Parquet/CSV labelled numeric snapshot"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  weekly:
    name: walk-forward candidate evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Resolve labelled snapshot
        env:
          INPUT_PATH: ${{ inputs.input_path }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -n "$INPUT_PATH" ] && [ -f "$INPUT_PATH" ]; then
            echo "FORECAST_INPUT_PATH=$INPUT_PATH" >> "$GITHUB_ENV"
            exit 0
          fi
          latest_run=$(gh run list --workflow forecast_online_daily.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$latest_run" ] || [ "$latest_run" = "null" ]; then
            echo "No successful online daily run is available for weekly evaluation."
            exit 2
          fi
          gh run download "$latest_run" --name "forecast-online-daily-$latest_run" --dir forecast_input
          resolved=$(find forecast_input -name 'labels_*.parquet' -type f | head -n 1)
          if [ -z "$resolved" ]; then
            echo "The daily artifact does not contain a labels Parquet file."
            exit 2
          fi
          echo "FORECAST_INPUT_PATH=$resolved" >> "$GITHUB_ENV"
      - name: Run weekly walk-forward evaluation
        run: python -m forecast.weekly --input "$FORECAST_INPUT_PATH" --artifact-root forecast_artifacts
      - name: Upload weekly candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: forecast-weekly-${{ github.run_id }}
          path: forecast_artifacts/
