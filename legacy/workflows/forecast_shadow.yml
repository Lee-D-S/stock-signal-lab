name: numeric forecast shadow

on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run until the point-in-time universe artifact is configured"
        required: true
        default: "dry-run"

permissions:
  contents: read

concurrency:
  group: forecast-shadow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: numeric pipeline shadow validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install forecast dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r forecast/requirements.txt
      - name: Run numeric daily dry-run
        run: python -m forecast.cli daily --dry-run --artifact-root forecast_artifacts
      - name: Run forecast unit tests
        run: python -m unittest discover -s forecast/tests -p "test_*.py"
      - name: Upload shadow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forecast-shadow-${{ github.run_id }}
          path: forecast_artifacts/
